name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v1.0.0). Must match the version in Cargo.toml."
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          echo "Cargo.toml version: $VERSION / tag: $TAG"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $VERSION"
            exit 1
          fi

      - name: Install Slint system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libfontconfig-dev libgl1-mesa-dev libwayland-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czvf GitTune-${{ runner.os }}.tar.gz -C target/release GitTune

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive target/release/GitTune.exe GitTune-${{ runner.os }}.zip

      # ------------------------------------------------------------------
      # Windows installers: MSIX (Store / sideload) and MSI (classic setup)
      # ------------------------------------------------------------------
      - name: Resolve package version (Windows)
        if: runner.os == 'Windows'
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Cargo.toml version '$version' is not a 3-part numeric version; MSI/MSIX cannot be built from it."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "msix_version=$version.0" >> $env:GITHUB_OUTPUT   # MSIX needs four fields
          Write-Host "Packaging GitTune $version (MSIX $version.0)"

      # The MSIX layout is: AppxManifest.xml + GitTune.exe + Assets\ at the
      # same level. Only ONE manifest may sit in the layout, so we copy
      # AppxManifest.xml (never Package.appxmanifest).
      - name: Build MSIX package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $version = '${{ steps.version.outputs.version }}'
          $msixVersion = '${{ steps.version.outputs.msix_version }}'

          $layout = Join-Path $PWD 'msix-layout'
          Remove-Item $layout -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path (Join-Path $layout 'Assets') | Out-Null
          Copy-Item (Join-Path $PWD 'AppxManifest.xml') $layout
          Copy-Item (Join-Path $PWD 'target\release\GitTune.exe') $layout
          Copy-Item (Join-Path $PWD 'Assets\*.png') (Join-Path $layout 'Assets')

          # Keep the packaged version in lock-step with Cargo.toml. The \b keeps
          # this from rewriting MinVersion=/MaxVersionTested= on TargetDeviceFamily.
          $manifestPath = Join-Path $layout 'AppxManifest.xml'
          $manifest = (Get-Content $manifestPath -Raw) -replace '\bVersion="\d+(\.\d+){1,3}"', "Version=`"$msixVersion`""
          if ($manifest -notmatch [regex]::Escape('Version="' + $msixVersion + '"')) {
            throw "Failed to stamp version $msixVersion into the Appx manifest"
          }
          Set-Content -Path $manifestPath -Value $manifest -Encoding UTF8

          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Where-Object { $_.Directory.Parent.Name -match '^\d+(\.\d+)+' } |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $makeappx) { throw 'makeappx.exe not found in the Windows SDK' }
          Write-Host "Using $($makeappx.FullName)"

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $msix = Join-Path $PWD "dist\GitTune-$version-x64.msix"
          & $makeappx.FullName pack /d $layout /p $msix /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed with exit code $LASTEXITCODE" }
          Write-Host "Wrote $msix"

      # WiX v5 is installed as a dotnet global tool, so the MSI build does not
      # depend on whichever WiX version the runner image happens to ship.
      - name: Build MSI package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $version = '${{ steps.version.outputs.version }}'   # MSI allows three fields only
          Write-Host "MSI version: $version"

          $wix = Join-Path $env:USERPROFILE '.dotnet\tools\wix.exe'
          if (-not (Test-Path $wix)) {
            dotnet tool install --global wix --version '5.*'
            if ($LASTEXITCODE -ne 0) { throw 'Failed to install the WiX toolset' }
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $wix build wix\GitTune.wxs `
            -arch x64 `
            -d "Version=$version" `
            -d "SourceDir=$PWD\target\release" `
            -d "IconFile=$PWD\Assets\gittune.ico" `
            -o "dist\GitTune-$version-x64.msi"
          if ($LASTEXITCODE -ne 0) { throw "wix build failed with exit code $LASTEXITCODE" }
          Write-Host "Wrote dist\GitTune-$version-x64.msi"

      # Optional code signing. Set the repository secrets MSIX_PFX_BASE64
      # (base64 of a .pfx code-signing certificate) and MSIX_PFX_PASSWORD to
      # turn this on; without them the installers ship unsigned, which is what
      # the Microsoft Store wants anyway (the Store re-signs MSIX on ingestion).
      - name: Sign Windows installers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
          MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:MSIX_PFX_BASE64)) {
            Write-Host 'No MSIX_PFX_BASE64 secret configured - shipping unsigned installers.'
            exit 0
          }

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Where-Object { $_.Directory.Parent.Name -match '^\d+(\.\d+)+' } |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found in the Windows SDK' }

          $pfx = Join-Path $PWD 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:MSIX_PFX_BASE64))

          foreach ($file in Get-ChildItem dist\*.msi, dist\*.msix) {
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:MSIX_PFX_PASSWORD `
              /tr http://timestamp.digicert.com /td SHA256 $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($file.Name)" }
          }

          # Publish the public certificate so users can trust the publisher.
          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:MSIX_PFX_PASSWORD)
          [IO.File]::WriteAllBytes((Join-Path $PWD 'dist\GitTune.cer'), $cert.Export('Cert'))
          Remove-Item $pfx -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitTune-${{ runner.os }}
          path: GitTune-${{ runner.os }}.*

      - name: Upload Windows installers (MSI + MSIX)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: GitTune-Windows-Installers
          path: |
            dist/*.msi
            dist/*.msix
            dist/*.cer
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: GitTune-*
          merge-multiple: true
          path: dist

      - name: Show release assets
        run: ls -lh dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          draft: true
          generate_release_notes: true
          files: dist/*
