name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v1.0.0). Must match the version in Cargo.toml."
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          echo "Cargo.toml version: $VERSION / tag: $TAG"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $VERSION"
            exit 1
          fi

      - name: Install Slint system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libfontconfig-dev libgl1-mesa-dev libwayland-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czvf GitTune-${{ runner.os }}.tar.gz -C target/release GitTune

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive target/release/GitTune.exe GitTune-${{ runner.os }}.zip

      # ------------------------------------------------------------------
      # Windows installers: MSIX (Store / sideload) and MSI (classic setup)
      # ------------------------------------------------------------------
      # Packaging (and its verification) lives in scripts/package-windows.ps1,
      # so the CI workflow exercises the exact same code path as this release.
      # Signing turns itself on when the MSIX_PFX_BASE64 secret is present.
      - name: Build, verify and sign Windows installers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
          MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/package-windows.ps1 -Verify

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitTune-${{ runner.os }}
          path: GitTune-${{ runner.os }}.*

      - name: Upload Windows installers (MSI + MSIX)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: GitTune-Windows-Installers
          path: |
            dist/*.msi
            dist/*.msix
            dist/*.cer
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: GitTune-*
          merge-multiple: true
          path: dist

      - name: Show release assets
        run: ls -lh dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          draft: true
          generate_release_notes: true
          files: dist/*
